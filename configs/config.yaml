api:
  base_url: "https://v3.football.api-sports.io"
  endpoints:
    # Dimensions (Bootstrap)
    leagues:
      path: "/leagues"
      allowed_params: ["id"]
      s3_template: "raw/dimensions/leagues/league_id={id}"

    teams:
      path: "/teams"
      allowed_params: ["league", "season"]
      s3_template: "raw/dimensions/teams/league_id={league}/season={season}"

    # Facts
    teams_statistics:
      path: "/teams/statistics"
      allowed_params: ["league", "season", "team", "date"]
      s3_template: "raw/facts/teams_statistics/league_id={league}/season={season}/team_id={team}/date={target_date}"

    standings:
      path: "/standings"
      allowed_params: ["league", "season", "team"]
      s3_template: "raw/facts/standings/league_id={league}/season={season}/date={target_date}"

    fixtures:
      path: "/fixtures"
      allowed_params: ["league", "season", "team", "date", "live", "status", "from", "to", "round"]
      s3_template: "raw/facts/fixtures/league_id={league}/season={season}/date={target_date}"

    fixtures_rounds:
      path: "/fixtures/rounds"
      allowed_params: ["league", "season", "current"]
      s3_template: "raw/facts/fixtures_rounds/league_id={league}/season={season}/date={target_date}"

    fixtures_head_to_head:
      path: "/fixtures/headtohead"
      allowed_params: ["h2h", "date", "league", "season", "last", "next", "from", "to", "status"]
      s3_template: "raw/facts/fixtures_head_to_head/h2h={h2h}/date={target_date}"

    fixtures_statistics:
      path: "/fixtures/statistics"
      allowed_params: ["fixture", "team", "type"]
      s3_template: "raw/facts/fixtures_statistics/fixture_id={fixture}"

    fixtures_events:
      path: "/fixtures/events"
      allowed_params: ["fixture", "team", "player", "type"]
      s3_template: "raw/facts/fixtures_events/fixture_id={fixture}"

    fixtures_lineups:
      path: "/fixtures/lineups"
      allowed_params: ["fixture", "team", "player", "type"]
      s3_template: "raw/facts/fixtures_lineups/fixture_id={fixture}"

    fixtures_players:
      path: "/fixtures/players"
      allowed_params: ["fixture", "team"]
      s3_template: "raw/facts/fixtures_players/fixture_id={fixture}"

    players_statistics:
      path: "/players"
      allowed_params: ["id", "team", "league", "season", "page"]
      s3_template: "raw/facts/players_statistics/league_id={league}/season={season}/date={target_date}"
    
    players_squads:
      path: "/players/squads"
      allowed_params: ["team"]
      s3_template: "raw/facts/players_squads/team_id={team}/date={target_date}"
    
    injuries:
      path: "/injuries"
      allowed_params: ["league", "season", "fixture", "team", "player", "date", "timezone"]
      s3_template: "raw/facts/injuries/league_id={league}/season={season}/date={target_date}"

    transfers:
      path: "/transfers"
      allowed_params: ["team", "player"]
      s3_template: "raw/facts/transfers/team_id={team}/date={target_date}"

  headers:
    key_name: "x-apisports-key"
  limits:
    delay_seconds: 7
    timeout_connect: 10
    timeout_read: 30