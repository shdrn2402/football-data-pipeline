name: CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8
        env:
          CLICKHOUSE_USER: ci
          CLICKHOUSE_PASSWORD: ci
          CLICKHOUSE_DB: ci
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider --quiet http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Run code formatting check
        run: uv run ruff format --check src/ tests/

      - name: Run unit tests
        run: uv run pytest tests/

      - name: Run dbt models against ClickHouse
        run: uv run pytest tests/integration
        env:
          RUN_INTEGRATION_TESTS: "1"
          CLICKHOUSE_USER: ci
          CLICKHOUSE_PASSWORD: ci
          CLICKHOUSE_DB: ci
